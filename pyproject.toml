[project]
name = "kie-proxy"
version = "0.1.0"
description = "Local proxy that exposes KIE (api.kie.ai) chat models through one OpenAI/Anthropic-compatible endpoint"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.41",
    "uvicorn>=0.32",
    "textual>=1.0",
    "typer>=0.15",
    "rich>=14",
]

[project.scripts]
kie-proxy = "kie_proxy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kie_proxy"]
